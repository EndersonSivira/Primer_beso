<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nuestro Primer Beso ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #08020a;
            color: #ffb3d9;
            font-family: 'Georgia', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            overflow-x: hidden;
            position: relative;
        }

        /* Contenedor principal estilo tarjeta */
        .card {
            background: rgba(25, 8, 25, 0.85);
            border: 1px solid #ff4d94;
            border-radius: 16px;
            box-shadow: 0 0 25px rgba(255, 77, 148, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 25px 20px;
            text-align: center;
            backdrop-filter: blur(5px);
            position: relative;
            z-index: 10;
        }

        h1 {
            color: #ff66a3;
            font-size: 22px;
            margin-bottom: 20px;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(255, 102, 163, 0.6);
        }

        /* Bloque del Poema de Fondo */
        .poem-container {
            font-style: italic;
            font-size: 15px;
            line-height: 1.8;
            color: #ffe6f2;
            background: rgba(50, 10, 35, 0.4);
            border-left: 3px solid #ff3385;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-shadow: 0 0 4px rgba(255, 179, 217, 0.4);
        }

        /* Área ASCII de los Enamorados */
        #scene {
            font-family: 'Courier New', Courier, monospace;
            white-space: pre;
            font-size: 13px;
            line-height: 1.2;
            color: #ff66a3;
            text-shadow: 0 0 6px #ff3385;
            margin: 20px 0;
            min-height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Resaltados brillantes */
        .heart {
            color: #ff0055;
            text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055;
            font-size: 16px;
        }

        /* Botón principal */
        button {
            background: linear-gradient(135deg, #ff3385, #990033);
            color: #ffffff;
            border: none;
            padding: 12px 28px;
            font-family: 'Georgia', serif;
            font-size: 15px;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 51, 133, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:active {
            transform: scale(0.96);
        }

        /* Corazones flotantes de fondo */
        .floating-heart {
            position: absolute;
            color: rgba(255, 77, 148, 0.3);
            font-size: 20px;
            animation: float 6s infinite linear;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) scale(0.8);
                opacity: 0;
            }
            50% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-10vh) scale(1.2);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Corazones flotantes -->
    <div class="floating-heart" style="left: 10%; animation-delay: 0s;">♥</div>
    <div class="floating-heart" style="left: 25%; animation-delay: 2s;">♥</div>
    <div class="floating-heart" style="left: 60%; animation-delay: 1s;">♥</div>
    <div class="floating-heart" style="left: 85%; animation-delay: 3s;">♥</div>

    <div class="card">
        <h1>Nuestro Primer Beso</h1>

        <!-- Poema dedicado al primer beso de ambos -->
        <div class="poem-container">
            "Dos almas temblorosas descubriendo el amor,<br>
            un suspiro que aguarda con dulce timidez.<br>
            Cerrando los ojos frente a una hermosa ilusión,<br>
            por primera vez juntos, por primera vez.<br><br>
            En el choque sagrado de tus labios y los míos,<br>
            el tiempo se detuvo y nació el universo."
        </div>

        <!-- Animación ASCII -->
        <div id="scene"></div>

        <button id="btn-kiss">Dar el Primer Beso</button>
    </div>

    <script>
        const scene = document.getElementById('scene');
        const btnKiss = document.getElementById('btn-kiss');

        // Cuadros ASCII del primer beso (paso a paso)
        const frames = [
            // Miradas nerviosas a la distancia
            `  ( •_•)                  (•_• )
  /  |  \\                /  |  \\
    / \\                    / \\`,

            // Dando el primer paso
            `     ( •_•)          (•_• )
     /  |  \\        /  |  \\
       / /            \\ \\`,

            // Cerca y timidez
            `        ( 😳)    (😳 )
        /  |  \\  /  |  \\
          / \\      / \\`,

            // El Primer Beso
            `           <span class="heart">♥  ♥  ♥</span>
         (   •_•)(•_•   )
          \\  |  /\\  |  /
            / \\    / \\
      <span class="heart">¡Nuestro Primer Beso Inolvidable!</span>`
        ];

        let currentFrame = 0;
        let isAnimating = false;

        function showFrame(index) {
            scene.innerHTML = frames[index];
        }

        btnKiss.addEventListener('click', () => {
            if (isAnimating) return;
            isAnimating = true;
            btnKiss.style.display = 'none';
            currentFrame = 0;

            showFrame(currentFrame);

            const timer = setInterval(() => {
                currentFrame++;
                if (currentFrame < frames.length) {
                    showFrame(currentFrame);
                } else {
                    clearInterval(timer);
                    btnKiss.textContent = "Revivir el Momento";
                    btnKiss.style.display = 'inline-block';
                    isAnimating = false;
                }
            }, 2500);
        });

        // Estado inicial
        showFrame(0);
    </script>
</body>
</html>
